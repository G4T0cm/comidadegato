<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ガチャポン | ¿Qué comerá gato hoy?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yusei+Magic&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --yellow:#FFC53D;
    --yellow-deep:#F2A70B;
    --red:#E8483C;
    --red-dark:#B12F26;
    --cream:#FFF7E3;
    --blue:#3E8FC0;
    --blue-deep:#1E5C82;
    --ink:#3B2617;
    --gold:#F4B942;
    --pink:#FF90AC;
    --glass:#CDEFFB;
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px 60px;
    font-family:'Zen Maru Gothic', sans-serif;
    color:var(--ink);
    background:
      radial-gradient(circle at 20% 15%, rgba(255,255,255,.5), transparent 40%),
      repeating-linear-gradient(135deg, var(--yellow) 0px, var(--yellow) 40px, var(--yellow-deep) 40px, var(--yellow-deep) 80px);
    overflow-x:hidden;
  }

  .scene{
    width:100%;
    max-width:420px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:18px;
  }

  /* ---------- Neon-ish sign ---------- */
  .sign{
    background:var(--red);
    border:5px solid var(--cream);
    border-radius:16px;
    padding:14px 22px;
    text-align:center;
    box-shadow: 0 8px 0 var(--red-dark), 0 12px 18px rgba(0,0,0,.25);
    transform:rotate(-1.5deg);
  }
  .sign .jp{
    font-family:'Yusei Magic', sans-serif;
    font-size:clamp(22px,6vw,30px);
    color:var(--cream);
    letter-spacing:1px;
    display:block;
    text-shadow: 0 2px 0 rgba(0,0,0,.15);
  }
  .sign .es{
    display:block;
    margin-top:4px;
    font-weight:700;
    font-size:clamp(13px,3.6vw,16px);
    color:var(--gold);
  }

  /* ---------- Machine ---------- */
  .machine{
    position:relative;
    width:min(300px, 78vw);
  }

  .dome{
    position:relative;
    height:170px;
    border-radius:150px 150px 20px 20px / 150px 150px 10px 10px;
    background:
      radial-gradient(circle at 30% 25%, rgba(255,255,255,.85), rgba(255,255,255,0) 35%),
      radial-gradient(circle at 70% 80%, rgba(0,0,0,.08), transparent 40%),
      var(--glass);
    border:6px solid var(--cream);
    border-bottom:6px solid var(--red);
    overflow:hidden;
    box-shadow: inset 0 -20px 30px rgba(30,92,130,.25), 0 4px 0 rgba(0,0,0,.1);
  }

  .capsule{
    position:absolute;
    width:26px;
    height:26px;
    border-radius:50%;
    overflow:hidden;
    animation: float 3.4s ease-in-out infinite;
    box-shadow: 0 2px 3px rgba(0,0,0,.2) inset, 0 2px 2px rgba(0,0,0,.15);
  }
  .capsule::before, .capsule::after{
    content:"";
    position:absolute;
    left:0; right:0; height:50%;
  }
  .capsule::before{ top:0; }
  .capsule::after{ bottom:0; }

  .capsule.c1{ top:20px; left:18px; --top:var(--pink); --bot:var(--cream); animation-delay:0s; }
  .capsule.c2{ top:60px; left:70px; --top:var(--blue); --bot:var(--cream); animation-delay:.4s; }
  .capsule.c3{ top:15px; left:120px; --top:var(--gold); --bot:var(--cream); animation-delay:.9s; }
  .capsule.c4{ top:75px; left:170px; --top:var(--red); --bot:var(--cream); animation-delay:.2s; }
  .capsule.c5{ top:40px; left:210px; --top:var(--pink); --bot:var(--yellow); animation-delay:1.1s; }
  .capsule.c6{ top:95px; left:30px; --top:var(--blue); --bot:var(--yellow); animation-delay:.7s; }
  .capsule.c7{ top:100px; left:130px; --top:var(--gold); --bot:var(--pink); animation-delay:1.4s; }
  .capsule::before{ background:var(--top); }
  .capsule::after{ background:var(--bot); }

  @keyframes float{
    0%,100%{ transform:translateY(0) rotate(0deg); }
    50%{ transform:translateY(-8px) rotate(8deg); }
  }

  .body-box{
    background:linear-gradient(180deg, var(--red) 0%, var(--red-dark) 100%);
    border:6px solid var(--cream);
    border-top:none;
    border-radius:0 0 20px 20px;
    padding:16px 16px 20px;
    position:relative;
  }

  .row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }

  .coin-slot{
    width:46px; height:14px;
    background:var(--ink);
    border-radius:8px;
    box-shadow: inset 0 2px 3px rgba(0,0,0,.6), 0 1px 0 rgba(255,255,255,.15);
  }

  .plate{
    font-family:'Yusei Magic', sans-serif;
    font-size:12px;
    color:var(--cream);
    background:var(--blue-deep);
    padding:5px 8px;
    border-radius:6px;
    border:2px solid var(--cream);
  }

  .crank-wrap{
    display:flex;
    justify-content:center;
    margin:14px 0 6px;
  }

  #crank{
    appearance:none;
    border:none;
    cursor:pointer;
    width:74px; height:74px;
    border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #fff8, transparent 40%), var(--gold);
    border:4px solid var(--cream);
    box-shadow: 0 6px 0 #b9861f, 0 8px 10px rgba(0,0,0,.3);
    position:relative;
    transition: transform .12s;
  }
  #crank:active{ transform:translateY(3px); box-shadow:0 3px 0 #b9861f; }
  #crank .handle{
    position:absolute;
    top:50%; left:50%;
    width:34px; height:10px;
    background:var(--cream);
    border-radius:6px;
    transform:translate(-50%,-50%);
    box-shadow: 0 1px 2px rgba(0,0,0,.3);
  }
  #crank .handle::after{
    content:"";
    position:absolute;
    right:-6px; top:50%;
    width:16px; height:16px;
    background:var(--red);
    border:3px solid var(--cream);
    border-radius:50%;
    transform:translateY(-50%);
  }
  #crank.turning{ animation: turn .55s linear; }
  @keyframes turn{ to{ transform:rotate(360deg); } }
  #crank:disabled{ cursor:not-allowed; opacity:.85; }

  .label-strip{
    text-align:center;
    font-family:'Yusei Magic', sans-serif;
    color:var(--cream);
    font-size:11px;
    letter-spacing:2px;
    margin-top:2px;
    opacity:.85;
  }

  .chute{
    width:36px; height:22px;
    margin:10px auto 0;
    background:var(--ink);
    border-radius:0 0 10px 10px;
    box-shadow: inset 0 3px 4px rgba(0,0,0,.6);
  }

  .tray{
    margin-top:6px;
    background:var(--cream);
    border:4px solid var(--ink);
    border-radius:12px;
    min-height:110px;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    overflow:hidden;
  }

  .hint{
    font-size:12px;
    color:#8a6a4a;
    text-align:center;
    padding:10px;
  }

  /* falling capsule */
  .falling-capsule{
    position:absolute;
    top:-30px;
    width:44px; height:44px;
    border-radius:50%;
    overflow:hidden;
    box-shadow: 0 3px 5px rgba(0,0,0,.3);
    animation: drop .55s cubic-bezier(.5,0,.75,.6) forwards;
  }
  .falling-capsule::before,.falling-capsule::after{
    content:""; position:absolute; left:0; right:0; height:50%;
  }
  .falling-capsule::before{ top:0; background:var(--top-c); }
  .falling-capsule::after{ bottom:0; background:var(--bot-c); }
  @keyframes drop{
    0%{ top:-30px; transform:rotate(0deg); }
    75%{ top:34px; transform:rotate(200deg); }
    85%{ top:26px; }
    100%{ top:34px; transform:rotate(220deg); }
  }

  .result-wrap{
    display:none;
    flex-direction:column;
    align-items:center;
    gap:4px;
    animation: pop-in .35s ease;
  }
  .result-wrap.show{ display:flex; }
  @keyframes pop-in{
    0%{ transform:scale(.4); opacity:0; }
    70%{ transform:scale(1.08); opacity:1; }
    100%{ transform:scale(1); }
  }
  .result-emoji{ font-size:44px; }
  .result-jp{
    font-family:'Yusei Magic', sans-serif;
    font-size:20px;
    color:var(--red-dark);
  }
  .result-es{
    font-weight:700;
    font-size:15px;
  }

  .half{
    position:absolute;
    width:44px; height:22px;
    border-radius:44px 44px 0 0;
    opacity:0;
  }
  .half.top{ border-radius:44px 44px 0 0; top:20px; }
  .half.bottom{ border-radius:0 0 44px 44px; top:42px; }
  .half.fly-left{ animation: flyL .5s ease forwards; }
  .half.fly-right{ animation: flyR .5s ease forwards; }
  @keyframes flyL{ to{ transform:translate(-60px,-10px) rotate(-70deg); opacity:0; } }
  @keyframes flyR{ to{ transform:translate(60px,-10px) rotate(70deg); opacity:0; } }

  .cat-row{
    display:flex;
    align-items:flex-end;
    gap:10px;
    min-height:56px;
  }
  .cat{
    font-size:42px;
    filter: drop-shadow(0 4px 3px rgba(0,0,0,.2));
    transform:scaleX(-1);
  }
  .bubble{
    background:#fff;
    border:3px solid var(--ink);
    border-radius:14px;
    padding:8px 12px;
    font-size:13px;
    font-weight:700;
    max-width:230px;
    position:relative;
    opacity:0;
    transform:translateY(6px);
    transition: opacity .3s ease, transform .3s ease;
  }
  .bubble.show{ opacity:1; transform:translateY(0); }
  .bubble::after{
    content:"";
    position:absolute;
    left:-9px; bottom:12px;
    border:7px solid transparent;
    border-right-color:var(--ink);
  }
  .bubble::before{
    content:"";
    position:absolute;
    left:-6px; bottom:13px;
    border:6px solid transparent;
    border-right-color:#fff;
    z-index:1;
  }

  .sr-only{
    position:absolute; width:1px; height:1px;
    overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap;
  }

  @media (prefers-reduced-motion: reduce){
    .capsule, #crank.turning, .falling-capsule, .result-wrap, .half{
      animation:none !important;
    }
  }
</style>
</head>
<body>

<div class="scene">

  <div class="sign">
    <span class="jp">猫は今日何を食べる？</span>
    <span class="es">¿Qué comerá gato hoy?</span>
  </div>

  <div class="machine">
    <div class="dome" aria-hidden="true">
      <div class="capsule c1"></div>
      <div class="capsule c2"></div>
      <div class="capsule c3"></div>
      <div class="capsule c4"></div>
      <div class="capsule c5"></div>
      <div class="capsule c6"></div>
      <div class="capsule c7"></div>
    </div>

    <div class="body-box">
      <div class="row">
        <div class="coin-slot" aria-hidden="true"></div>
        <div class="plate">NEKO-GACHA</div>
      </div>

      <div class="crank-wrap">
        <button id="crank" type="button" aria-label="Girar la manivela del gachapon">
          <span class="handle"></span>
        </button>
      </div>
      <div class="label-strip">GIRA PARA JUGAR</div>

      <div class="chute" aria-hidden="true"></div>

      <div class="tray" id="tray">
        <p class="hint" id="hint">La cápsula caerá aquí…</p>
        <div class="result-wrap" id="resultWrap">
          <div class="result-emoji" id="resultEmoji"></div>
          <div class="result-jp" id="resultJp"></div>
          <div class="result-es" id="resultEs"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="cat-row">
    <div class="cat">🐱</div>
    <div class="bubble" id="bubble"></div>
  </div>

  <p aria-live="polite" class="sr-only" id="liveRegion"></p>
</div>

<script>
(function(){
  const crank = document.getElementById('crank');
  const tray = document.getElementById('tray');
  const hint = document.getElementById('hint');
  const resultWrap = document.getElementById('resultWrap');
  const resultEmoji = document.getElementById('resultEmoji');
  const resultJp = document.getElementById('resultJp');
  const resultEs = document.getElementById('resultEs');
  const bubble = document.getElementById('bubble');
  const liveRegion = document.getElementById('liveRegion');

  const outcomes = [
    { id:'arroz',  emoji:'🍚', jp:'ご飯', es:'¡Arroz!',  top:'#FF90AC', bot:'#FFF7E3', phrase:'¡Hoy toca comer Arroz!.' },
    { id:'fideos', emoji:'🍜', jp:'麺',   es:'¡Fideos!', top:'#3E8FC0', bot:'#FFF7E3', phrase:'¡Hoy toca comer fideos!.' }
  ];

  let busy = false;
  let audioCtx = null;

  function getCtx(){
    if(!audioCtx){
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if(audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  function tone(freq, start, dur, type, gainPeak){
    const ctx = getCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type || 'square';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.0001, ctx.currentTime + start);
    gain.gain.exponentialRampToValueAtTime(gainPeak || 0.18, ctx.currentTime + start + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + start + dur);
    osc.connect(gain).connect(ctx.destination);
    osc.start(ctx.currentTime + start);
    osc.stop(ctx.currentTime + start + dur + 0.02);
  }

  function noiseBurst(start, dur, filterFreq, gainPeak){
    const ctx = getCtx();
    const bufferSize = Math.floor(ctx.sampleRate * dur);
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for(let i=0;i<bufferSize;i++){ data[i] = (Math.random()*2-1) * (1 - i/bufferSize); }
    const src = ctx.createBufferSource();
    src.buffer = buffer;
    const filter = ctx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.value = filterFreq || 1200;
    const gain = ctx.createGain();
    gain.gain.setValueAtTime(gainPeak || 0.3, ctx.currentTime + start);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + start + dur);
    src.connect(filter).connect(gain).connect(ctx.destination);
    src.start(ctx.currentTime + start);
  }

  function playRatchet(){
    // crank turning: a series of little clicks
    for(let i=0;i<6;i++){
      noiseBurst(i*0.08, 0.05, 2600 + i*80, 0.14);
      tone(900 + i*30, i*0.08, 0.04, 'square', 0.05);
    }
  }

  function playThud(){
    tone(110, 0, 0.18, 'sine', 0.35);
    noiseBurst(0, 0.12, 500, 0.25);
  }

  function playPop(){
    noiseBurst(0, 0.08, 3200, 0.3);
    tone(700, 0, 0.06, 'triangle', 0.2);
  }

  function playJingle(){
    const notes = [523.25, 659.25, 783.99, 1046.5]; // C5 E5 G5 C6
    notes.forEach((f,i)=> tone(f, i*0.11, 0.22, 'triangle', 0.2));
  }

  function resetTray(){
    resultWrap.classList.remove('show');
    hint.style.display = 'block';
    bubble.classList.remove('show');
    bubble.textContent = '';
    const oldFalling = tray.querySelectorAll('.falling-capsule, .half');
    oldFalling.forEach(el => el.remove());
  }

  function spawnCapsule(outcome){
    const cap = document.createElement('div');
    cap.className = 'falling-capsule';
    cap.style.setProperty('--top-c', outcome.top);
    cap.style.setProperty('--bot-c', outcome.bot);
    cap.style.left = 'calc(50% - 22px)';
    tray.appendChild(cap);
    return cap;
  }

  function crackOpen(capsuleEl, outcome){
    const top = document.createElement('div');
    top.className = 'half top';
    top.style.background = outcome.top;
    top.style.left = capsuleEl.style.left;

    const bottom = document.createElement('div');
    bottom.className = 'half bottom';
    bottom.style.background = outcome.bot;
    bottom.style.left = capsuleEl.style.left;

    tray.appendChild(top);
    tray.appendChild(bottom);
    capsuleEl.remove();

    requestAnimationFrame(()=>{
      top.classList.add('fly-left');
      bottom.classList.add('fly-right');
    });

    playPop();

    setTimeout(()=>{
      hint.style.display = 'none';
      resultEmoji.textContent = outcome.emoji;
      resultJp.textContent = outcome.jp;
      resultEs.textContent = outcome.es;
      resultWrap.classList.add('show');
      playJingle();
      bubble.textContent = outcome.phrase;
      requestAnimationFrame(()=> bubble.classList.add('show'));
      liveRegion.textContent = outcome.es + ' ' + outcome.phrase;
      top.remove(); bottom.remove();
      busy = false;
      crank.disabled = false;
    }, 480);
  }

  crank.addEventListener('click', function(){
    if(busy) return;
    busy = true;
    crank.disabled = true;
    resetTray();
    getCtx();

    crank.classList.remove('turning');
    void crank.offsetWidth; // restart animation
    crank.classList.add('turning');
    playRatchet();

    setTimeout(()=>{
      const outcome = outcomes[Math.floor(Math.random() * outcomes.length)];
      const capsuleEl = spawnCapsule(outcome);
      playThud();
      setTimeout(()=> crackOpen(capsuleEl, outcome), 560);
    }, 600);
  });
})();
</script>

</body>
</html>
